name: VeroSpace V7 Autoplay Source Patch
on:
  push:
    branches: [verospace-canonical-upgrade-v7]
    paths: ['.github/workflows/v7-autoplay-source-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verospace-canonical-upgrade-v7
      - name: Patch logical index at autoplay transition start
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v7-canonical.js')
          s=p.read_text()
          old="""      const w=width();
      const a=current(),b=next();
      setSlideTransition(a,reduced.matches?'none':'transform 430ms cubic-bezier(.16,1,.3,1)');"""
          new="""      const w=width();
      const a=current(),b=next();
      // Autoplay changes logical ownership exactly when the 5s transition starts;
      // the premium 430ms visual settle continues independently.
      if(commit&&source==='auto')track.dataset.v7Index=String(nextIndex);
      setSlideTransition(a,reduced.matches?'none':'transform 430ms cubic-bezier(.16,1,.3,1)');"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          node --check v7-canonical.js
      - name: Commit patch
        run: |
          git config user.name "VeroSpace QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add v7-canonical.js
          git commit -m "fix: mark autoplay image active when 5s transition starts"
          git push origin HEAD:verospace-canonical-upgrade-v7
