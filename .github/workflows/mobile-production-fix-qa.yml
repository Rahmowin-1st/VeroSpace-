name: VeroSpace Mobile Production Fix QA
on:
  push:
    branches: [verospace-mobile-production-fix]
    paths: ['.github/workflows/mobile-production-fix-qa.yml']
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run real Chromium responsive QA
        env:
          TARGET_URL: 'https://verospace-landing-eatruping-shahboz.vercel.app/?_vercel_share=aACVcMIBFUJSKyHZ2r76R9NKaOtHYOFd'
        run: |
          cat > /tmp/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const target=process.env.TARGET_URL;
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1440,900],[1920,1080]];
          const browser=await chromium.launch({headless:true});
          const report=[];
          const fail=(m)=>{throw new Error(m)};
          for(const [width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(target,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.hero').waitFor({state:'visible',timeout:30000});
            await page.locator('.hero-image').waitFor({state:'visible',timeout:30000});
            await page.waitForTimeout(1000);
            const base=await page.evaluate(()=>({
              y:scrollY, sw:document.documentElement.scrollWidth, iw:innerWidth,
              ctas:[...document.querySelectorAll('.hero-actions .button')].map(x=>x.textContent.trim()),
              navs:document.querySelectorAll('.mobile-journey-dock,.hero-dock,.hero-rail').length,
              hero:{src:document.querySelector('.hero-image')?.getAttribute('src'),nw:document.querySelector('.hero-image')?.naturalWidth,nh:document.querySelector('.hero-image')?.naturalHeight}
            }));
            if(base.y!==0) fail(`${width}: initial scrollY ${base.y}`);
            if(base.sw>base.iw+1) fail(`${width}: horizontal overflow ${base.sw}>${base.iw}`);
            if(base.ctas.length!==2||base.ctas[0]!=='Book a consultation'||base.ctas[1]!=='Explore projects') fail(`${width}: hero CTAs wrong ${JSON.stringify(base.ctas)}`);
            if(base.navs!==0) fail(`${width}: forbidden bottom nav present`);
            if(!base.hero.src?.includes('verospace-home-yellow.webp')||base.hero.nw<300||base.hero.nh<300) fail(`${width}: supplied hero not loaded ${JSON.stringify(base.hero)}`);
            const asset=await page.evaluate(async()=>{const r=await fetch('/assets/verospace-home-yellow.webp');const b=await r.blob();return {status:r.status,type:r.headers.get('content-type'),size:b.size}});
            if(asset.status!==200||asset.type!=='image/webp'||asset.size<10000) fail(`${width}: hero asset bad ${JSON.stringify(asset)}`);
            if(width<=900){
              await page.locator('.menu-button').click();
              await page.locator('.site-menu.open').waitFor({state:'visible',timeout:5000});
              await page.waitForTimeout(350);
              const menu=await page.evaluate(()=>{
                const el=document.querySelector('.site-menu'); const r=el.getBoundingClientRect(); const cs=getComputedStyle(el);
                const links=[...document.querySelectorAll('.menu-links strong')].map(x=>{const q=x.getBoundingClientRect();return {t:x.textContent.trim(),w:q.width,h:q.height}});
                return {x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,bg:cs.backgroundImage,bgc:cs.backgroundColor,links,overflow:document.documentElement.scrollWidth-innerWidth,aria:el.getAttribute('aria-hidden')};
              });
              if(Math.abs(menu.x)>1||Math.abs(menu.y)>1||Math.abs(menu.w-menu.vw)>2||Math.abs(menu.h-menu.vh)>2) fail(`${width}: menu not full viewport ${JSON.stringify(menu)}`);
              if(menu.links.length!==5||menu.links.some(x=>x.w<120||x.h>55)) fail(`${width}: menu text broken ${JSON.stringify(menu.links)}`);
              if(menu.overflow>1) fail(`${width}: menu overflow ${menu.overflow}`);
              if(menu.aria!=='false') fail(`${width}: menu aria-hidden wrong`);
              await page.keyboard.press('Escape');
              await page.waitForTimeout(100);
              if(await page.locator('.site-menu').evaluate(el=>el.classList.contains('open'))) fail(`${width}: Escape did not close menu`);
            }
            await page.mouse.wheel(0,600); await page.waitForTimeout(250); const down=await page.evaluate(()=>scrollY);
            if(down<100) fail(`${width}: native wheel scroll did not move (${down})`);
            await page.mouse.wheel(0,-600); await page.waitForTimeout(250);
            const api=await page.evaluate(async()=>{const r=await fetch('/api/consultation');return r.status});
            if(api!==405) fail(`${width}: consultation GET expected 405 got ${api}`);
            if(pageErrors.length) fail(`${width}: page errors ${pageErrors.join(' | ')}`);
            report.push({width,height,asset,menu:width<=900?'GREEN':'desktop',scrollDown:down});
            await context.close();
          }
          await browser.close();
          console.log(JSON.stringify({status:'GREEN',report},null,2));
          EOF
          node /tmp/qa.mjs
