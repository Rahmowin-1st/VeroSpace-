name: VeroSpace V7 Autoplay QA
on:
  push:
    branches: [verospace-canonical-upgrade-v7]
    paths: ['.github/workflows/v7-autoplay-qa.yml']
jobs:
  autoplay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: python3 -m http.server 4173 >/tmp/http.log 2>&1 & sleep 1
      - name: Verify hold pause and 5s resume
        run: |
          cat > qa-autoplay.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.route('https://unsplash.com/**',r=>r.abort());
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelectorAll('.vs-select-trigger').length===2);
          await page.waitForFunction(()=>document.querySelectorAll('.project-track figure.v7-current').length===5);
          const stage=page.locator('.project-stage').first();
          await stage.scrollIntoViewIfNeeded();
          await page.waitForTimeout(1500); // one-time hint has returned to slide 1
          const box=await stage.boundingBox();
          if(!box)throw new Error('stage missing');
          await page.mouse.move(box.x+box.width*.7,box.y+box.height*.5);
          await page.mouse.down();
          const held=await stage.locator('.project-track').getAttribute('data-v7-index');
          await page.waitForTimeout(5400);
          const duringHold=await stage.locator('.project-track').getAttribute('data-v7-index');
          if(duringHold!==held)throw new Error(`autoplay moved while held: ${held}->${duringHold}`);
          await page.mouse.up();
          await page.waitForTimeout(5650); // 5s timer + ~430ms visual settle + margin
          const after=await stage.locator('.project-track').getAttribute('data-v7-index');
          if(after===held)throw new Error(`autoplay did not complete after release: ${held}`);
          const counter=Number(await stage.locator('.swipe-counter').evaluate(el=>getComputedStyle(el).opacity));
          if(counter>.08)throw new Error(`autoplay exposed user-swipe counter: ${counter}`);
          console.log(`AUTOPLAY_GREEN ${held}->${after}`);
          await browser.close();
          EOF
          node qa-autoplay.mjs
