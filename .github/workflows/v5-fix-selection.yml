name: V5 Hero Seam Fix
on:
  push:
    branches: [verospace-projects-v5]
    paths: ['.github/workflows/v5-fix-selection.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: verospace-projects-v5}
      - name: Keep fade below hero copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v5.css')
          s=p.read_text()
          old='.hero-fade{position:absolute;z-index:1;left:0;right:0;bottom:-1px;height:190px;'
          assert old in s
          s=s.replace(old,'.hero-fade{position:absolute;z-index:1;left:0;right:0;bottom:-1px;height:110px;')
          old2='.hero-fade{height:145px}'
          assert old2 in s
          s=s.replace(old2,'.hero-fade{height:88px}')
          p.write_text(s)
          PY
      - name: Commit seam fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5.css
          git commit -m 'fix: keep hero fade below interactive copy'
          git push origin HEAD:verospace-projects-v5
