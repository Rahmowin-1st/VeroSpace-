name: V5 Image URL Resolver
on:
  push:
    branches: [verospace-projects-v5]
    paths: ['.github/workflows/v5-fix-selection.yml']
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: verospace-projects-v5}
      - name: Resolve Unsplash download redirects
        run: |
          mkdir -p .qa
          : > .qa/unsplash-resolved.txt
          for id in \
            OcxgtPN0FmM uaO2jAFKR0c U74CPDcq5OY \
            881IAs1vdE4 n4U6GwZJmBM lq8FnmruSjo \
            G8kRVwlZK3Q 3bgpVpEZV6s GRxzOdEUKVg \
            hjNTscPXJTg rFpEHzGB37w 54xFukuLp1E \
            NMXNCYy-2ks B6ZXOlMO3EY mQmDscIIQfs
          do
            url="https://unsplash.com/photos/${id}/download?force=true"
            final=$(curl -L --max-time 30 --retry 2 --retry-delay 1 -sS -o /dev/null -w '%{url_effective}' "$url")
            status=$(curl -L --max-time 30 --retry 2 --retry-delay 1 -sS -o /dev/null -w '%{http_code}' "$url")
            printf '%s\t%s\t%s\n' "$id" "$status" "$final" | tee -a .qa/unsplash-resolved.txt
          done
      - name: Persist resolver result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .qa/unsplash-resolved.txt
          git commit -m 'test: persist resolved project image URLs'
          git push origin HEAD:verospace-projects-v5
