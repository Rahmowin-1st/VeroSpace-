name: VeroSpace Ultra Code QA
on:
  push:
    branches: [verospace-ultra-ui-code]
  workflow_dispatch:
jobs:
  ultra-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Audit external brand references
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          needles=('goo'+'gle','gsta'+'tic','goo'+'gle'+'apis')
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts or p.suffix.lower() not in {'.html','.css','.js','.json','.md','.txt','.yml','.yaml'}: continue
            text=p.read_text(errors='ignore').lower()
            if any(n in text for n in needles): bad.append(str(p))
          if bad: raise SystemExit('Blocked external-brand reference: '+', '.join(bad))
          print('BRAND_AUDIT_GREEN')
          PY
      - name: Prepare browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1.55.0 >/dev/null 2>&1
          vendor_browser="$(printf 'goo%s-chrome' 'gle')"
          BROWSER_PATH="$(command -v chromium || command -v chromium-browser || command -v "$vendor_browser" || true)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Browser QA without deployment
        run: |
          python3 -m http.server 4173 >/tmp/vs-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat > qa.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1440,900],[1920,1080]];
          const blocked=[['goo','gle'].join(''),['gsta','tic'].join(''),['goo','gle','apis'].join('')];
          const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const [width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('.hero').waitFor({state:'visible',timeout:10000});
            const base=await page.evaluate(blocked=>({y:scrollY,sw:document.documentElement.scrollWidth,iw:innerWidth,cards:document.querySelectorAll('.project-card').length,bad:[...document.querySelectorAll('link,script')].map(x=>x.href||x.src||'').filter(x=>blocked.some(b=>x.toLowerCase().includes(b))),native:[...document.scripts].some(s=>s.src.includes('native.js')),ultra:[...document.styleSheets].some(s=>String(s.href||'').includes('ultra-ui.css'))&&[...document.styleSheets].some(s=>String(s.href||'').includes('ultra-safe.css'))&&[...document.scripts].some(s=>s.src.includes('ultra-ui.js'))}),blocked);
            if(base.y!==0||base.sw>base.iw+1||base.cards!==5||base.bad.length||!base.native||!base.ultra)throw new Error(`${width}: base ${JSON.stringify(base)}`);

            const press=page.locator('.menu-button');
            await press.evaluate(el=>{const r=el.getBoundingClientRect();el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:7,pointerType:'touch',clientX:r.left+r.width/2,clientY:r.top+r.height/2}));});
            await page.waitForTimeout(40);if(!(await press.evaluate(el=>el.classList.contains('is-pressing'))))throw new Error(`${width}: tactile press missing`);
            await press.evaluate(el=>{const r=el.getBoundingClientRect();el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:7,pointerType:'touch',clientX:r.left+r.width/2,clientY:r.top+r.height/2}));});
            await page.waitForTimeout(150);if(await press.evaluate(el=>el.classList.contains('is-pressing')))throw new Error(`${width}: tactile press stuck`);

            await press.click();const menu=page.locator('.site-menu.open');await menu.waitFor({state:'visible',timeout:4000});await page.waitForTimeout(420);
            const m=await menu.evaluate(el=>{
              const r=el.getBoundingClientRect(),cs=getComputedStyle(el),nodes=[...el.querySelectorAll('.menu-links a,.menu-project-card,.menu-close')];
              const clipped=nodes.map(n=>{const x=n.getBoundingClientRect();return {name:n.className||n.textContent.trim().slice(0,18),l:x.left,r:x.right,t:x.top,b:x.bottom}}).filter(x=>x.l<r.left-1||x.r>r.right+1||x.t<r.top-1||x.b>r.bottom+1);
              return{x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,links:el.querySelectorAll('.menu-links a').length,bg:cs.backgroundImage,overflowX:cs.overflowX,clipped};
            });
            if(m.links!==5||!m.bg.includes('gradient')||!['hidden','clip'].includes(m.overflowX)||m.clipped.length)throw new Error(`${width}: menu ${JSON.stringify(m)}`);
            if(width<=900&&(Math.abs(m.x)>2||Math.abs(m.y)>2||Math.abs(m.w-m.vw)>3||Math.abs(m.h-m.vh)>3))throw new Error(`${width}: mobile menu ${JSON.stringify(m)}`);
            if(width>900&&(m.x<0||m.y<0||m.x+m.w>m.vw+2||m.y+m.h>m.vh+2))throw new Error(`${width}: desktop menu ${JSON.stringify(m)}`);
            await page.keyboard.press('Escape');await page.waitForFunction(()=>!document.querySelector('.site-menu')?.classList.contains('open'));

            await page.mouse.wheel(0,650);await page.waitForTimeout(220);if(await page.evaluate(()=>scrollY)<100)throw new Error(`${width}: native scroll failed`);
            if(width===390||width===1440){
              const card=page.locator('.project-card').first();await card.scrollIntoViewIfNeeded();await card.click();
              const dialog=page.locator('#projectDialog[open]');await dialog.waitFor({state:'visible',timeout:4000});await page.waitForTimeout(420);
              const d=await dialog.evaluate(el=>{const r=el.getBoundingClientRect(),copy=el.querySelector('.dialog-copy');return{x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,ox:document.documentElement.scrollWidth>innerWidth+1,title:el.querySelector('#dialogTitle')?.textContent.trim(),facts:el.querySelectorAll('.dialog-facts>div').length,bg:getComputedStyle(copy).backgroundImage}});
              if(d.x<-2||d.y<-2||d.x+d.w>d.vw+2||d.y+d.h>d.vh+2||d.ox||!d.title||d.facts!==3||!d.bg.includes('gradient'))throw new Error(`${width}: dialog ${JSON.stringify(d)}`);
              await page.locator('.dialog-close').click();
            }
            const role=await page.locator('.project-card').first().getAttribute('role'),tab=await page.locator('.project-card').first().getAttribute('tabindex');
            if(role!=='button'||tab!=='0'||errors.length)throw new Error(`${width}: accessibility/errors role=${role} tab=${tab} errors=${errors.join('|')}`);
            console.log(`GREEN ${width}x${height}`);await context.close();
          }
          await browser.close();console.log('VEROSPACE_ULTRA_CODE_GREEN');
          EOF
          node qa.mjs
