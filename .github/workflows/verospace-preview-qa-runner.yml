name: VeroSpace Preview QA Runner
on:
  push:
    branches: [verospace-final-qa]
    paths:
      - '.github/workflows/verospace-preview-qa-runner.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: 'http://127.0.0.1:4173/'
      CLEAN_URL: 'http://127.0.0.1:4173/'
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start deterministic preview server
        run: |
          cat > /tmp/server.mjs <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.cwd();
          const mime={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8','.js':'text/javascript; charset=utf-8','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/jpeg'};
          http.createServer((req,res)=>{
            const u=new URL(req.url,'http://127.0.0.1');
            if(u.pathname==='/api/consultation'){
              if(req.method!=='POST'){res.writeHead(405,{'Allow':'POST','Content-Type':'application/json'});return res.end(JSON.stringify({error:'Method not allowed'}));}
              res.writeHead(503,{'Content-Type':'application/json'});return res.end(JSON.stringify({error:'Email disabled in QA'}));
            }
            let rel=u.pathname==='/'?'index.html':u.pathname.replace(/^\//,'');
            rel=decodeURIComponent(rel);
            const file=path.resolve(root,rel);
            if(!file.startsWith(root)||!fs.existsSync(file)||!fs.statSync(file).isFile()){res.writeHead(404);return res.end('Not found');}
            res.writeHead(200,{'Content-Type':mime[path.extname(file).toLowerCase()]||'application/octet-stream','Cache-Control':'no-store'});
            fs.createReadStream(file).pipe(res);
          }).listen(4173,'127.0.0.1',()=>console.log('QA server ready'));
          EOF
          node /tmp/server.mjs >/tmp/verospace-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/verospace-server.log
          exit 1
      - name: Extract and run QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/verospace-preview-qa.yml').read_text()
          marker="          cat > /tmp/qa.mjs <<'EOF'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          EOF",start)
          Path('/tmp/qa.mjs').write_text(text[start:end])
          PY
          ln -s "$PWD/node_modules" /tmp/node_modules
          node /tmp/qa.mjs
