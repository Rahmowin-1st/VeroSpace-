name: VeroSpace V7 Diagnostic
on:
  push:
    branches: [verospace-canonical-upgrade-v7]
    paths: ['.github/workflows/v7-diagnostic.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Syntax checks
        run: |
          node --check native.js
          node --check v5.js
          node --check v7-canonical.js
          node --check api/consultation.js
      - name: Browser loader diagnostic
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 1
          cat > diag.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[]; const logs=[];
          page.on('pageerror',e=>errors.push(String(e.stack||e)));
          page.on('console',m=>logs.push(`${m.type()}: ${m.text()}`));
          page.on('requestfailed',r=>logs.push(`requestfailed: ${r.url()} :: ${r.failure()?.errorText}`));
          await page.route('https://unsplash.com/**',r=>r.abort());
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(2500);
          const state=await page.evaluate(()=>({
            ready:document.readyState,
            nativeSrc:[...document.scripts].map(s=>s.src),
            css:[...document.styleSheets].map(s=>s.href),
            selectCount:document.querySelectorAll('select').length,
            custom:document.querySelectorAll('.vs-select-trigger').length,
            currentSlides:document.querySelectorAll('.project-track figure.v7-current').length,
            v7Script:Boolean(document.querySelector('script[data-verospace-v7]')),
            v7Css:Boolean(document.querySelector('link[data-verospace-v7]')),
            bodyDataset:{...document.body.dataset}
          }));
          console.log('STATE '+JSON.stringify(state));
          console.log('ERRORS '+JSON.stringify(errors));
          console.log('LOGS '+JSON.stringify(logs.slice(-30)));
          await browser.close();
          if(errors.length||state.custom!==2||state.currentSlides!==5)process.exit(1);
          EOF
          node diag.mjs
