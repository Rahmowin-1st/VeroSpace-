name: VeroSpace Conversion Motion Code QA
on:
  push:
    branches: [verospace-conversion-motion-v1]
  workflow_dispatch:
jobs:
  conversion-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Gate A — source, brand and native-scroll audit
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime=['index.html','styles.css','ultra-ui.css','ultra-safe.css','mobile-fix.css','conversion.css','conversion-tune.css','script.js','native.js','ultra-ui.js','conversion-motion.js','conversion-flow.js']
          text='\n'.join(Path(p).read_text(errors='ignore') for p in runtime if Path(p).exists()).lower()
          blocked=('goo'+'gle','gsta'+'tic','goo'+'gle'+'apis')
          found=[x for x in blocked if x in text]
          if found: raise SystemExit('blocked external-brand runtime reference: '+','.join(found))
          motion=Path('conversion-motion.js').read_text(errors='ignore')
          combined=motion+'\n'+Path('conversion-flow.js').read_text(errors='ignore')
          forbidden=['ScrollSmoother','normalizeScroll','scroll-snap','scrollTop =','scrollTop=','window.scrollTo(','document.documentElement.scrollTop','pin:','snap:']
          bad=[x for x in forbidden if x in combined]
          if bad: raise SystemExit('scroll ownership violation: '+','.join(bad))
          if 'ScrollTrigger' not in motion or 'gsap' not in motion: raise SystemExit('GSAP/ScrollTrigger motion layer missing')
          print('GATE_A_GREEN')
          PY

      - name: Prepare browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1.55.0 >/dev/null 2>&1
          BROWSER_PATH="$(command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Gates B–G — local Chromium matrix, GSAP, proof, CTA and reduced motion
        run: |
          python3 -m http.server 4173 >/tmp/verospace-conversion-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat > qa-conversion.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1366,768],[1440,900],[1600,900],[1920,1080]];
          const requiredOrder=['home','trust-band','projects','services','reference-gallery','visual-story','process','principles','cta-bridge','contact'];
          const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});

          for(const [width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.classList.contains('conversion-flow-ready'),{timeout:12000});
            await page.waitForFunction(()=>document.documentElement.dataset.motion==='gsap',{timeout:22000});
            await page.waitForTimeout(1000);

            const base=await page.evaluate(requiredOrder=>{
              const label=e=>e.id||['trust-band','reference-gallery','visual-story','principles','cta-bridge'].find(c=>e.classList.contains(c))||'';
              const order=[...document.querySelector('main').children].map(label).filter(x=>requiredOrder.includes(x));
              const serviceCopy=[...document.querySelectorAll('.service-feature p')].map(x=>x.textContent.trim().length);
              const processCopy=[...document.querySelectorAll('.process-list > li p')].map(x=>x.textContent.trim().length);
              return {
                y:scrollY,sw:document.documentElement.scrollWidth,iw:innerWidth,
                order,
                trust:document.querySelectorAll('.trust-item').length,
                projects:document.querySelectorAll('.project-card').length,
                outcomes:document.querySelectorAll('.project-outcome').length,
                refs:document.querySelectorAll('.reference-tile').length,
                services:document.querySelectorAll('.service-feature').length,
                process:document.querySelectorAll('.process-list > li').length,
                contactCtas:document.querySelectorAll('[data-scroll="#contact"]').length,
                heroNote:document.querySelector('.hero-reassurance')?.textContent.trim()||'',
                serviceCopy,processCopy,
                triggers:window.ScrollTrigger?.getAll?.().length||0,
                pinned:(window.ScrollTrigger?.getAll?.()||[]).some(t=>!!t.vars.pin),
                motion:document.documentElement.dataset.motion,
                sequence:document.querySelector('main')?.dataset.conversionOrder||'',
                bad:[...document.querySelectorAll('script[src],link[href]')].map(x=>x.src||x.href).filter(u=>u&&u.toLowerCase().includes(['goo','gle'].join('')))
              };
            },requiredOrder);

            if(base.y!==0) throw new Error(`${width}: initial scroll ${base.y}`);
            if(base.sw>base.iw+1) throw new Error(`${width}: horizontal overflow ${base.sw}>${base.iw}`);
            if(JSON.stringify(base.order)!==JSON.stringify(requiredOrder)) throw new Error(`${width}: conversion order ${JSON.stringify(base.order)}`);
            if(base.trust!==4||base.projects!==5||base.outcomes!==5||base.refs!==9||base.services!==4||base.process!==5) throw new Error(`${width}: structure ${JSON.stringify(base)}`);
            if(base.contactCtas<3||!base.heroNote.includes('No polished brief')) throw new Error(`${width}: CTA/friction layer missing`);
            if(base.serviceCopy.some(n=>n>62)||base.processCopy.some(n=>n>40)) throw new Error(`${width}: copy length services=${base.serviceCopy} process=${base.processCopy}`);
            if(base.motion!=='gsap'||base.triggers<18||base.pinned) throw new Error(`${width}: GSAP gate ${JSON.stringify(base)}`);
            if(!base.sequence.includes('outcome-trust-proof')) throw new Error(`${width}: psychological sequence marker missing`);
            if(base.bad.length) throw new Error(`${width}: blocked runtime reference ${base.bad}`);

            const refs=page.locator('.reference-tile img');
            await refs.first().scrollIntoViewIfNeeded(); await page.waitForTimeout(1200);
            const loaded=await refs.evaluateAll(imgs=>imgs.filter(i=>i.complete&&i.naturalWidth>0).length);
            if(loaded<7) throw new Error(`${width}: reference image decode ${loaded}/9`);

            const before=await page.evaluate(()=>scrollY);
            await page.mouse.wheel(0,760); await page.waitForTimeout(320);
            const after=await page.evaluate(()=>scrollY);
            if(after<before+120) throw new Error(`${width}: native wheel failed ${before}->${after}`);

            if(width===390||width===1440){
              const card=page.locator('.project-card').first(); await card.scrollIntoViewIfNeeded(); await page.waitForTimeout(450); await card.click();
              const dialog=page.locator('#projectDialog[open]'); await dialog.waitFor({state:'visible',timeout:5000}); await page.waitForTimeout(550);
              const d=await dialog.evaluate(el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,title:el.querySelector('#dialogTitle')?.textContent.trim(),facts:el.querySelectorAll('.dialog-facts>div').length}});
              if(d.x<-2||d.y<-2||d.x+d.w>d.vw+2||d.y+d.h>d.vh+2||!d.title||d.facts!==3) throw new Error(`${width}: project dialog ${JSON.stringify(d)}`);
              await page.locator('.dialog-close').click();
            }

            const menuButton=page.locator('.menu-button'); await menuButton.click(); await page.locator('.site-menu.open').waitFor({state:'visible',timeout:5000}); await page.waitForTimeout(500);
            const m=await page.locator('.site-menu').evaluate(el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,links:el.querySelectorAll('.menu-links a').length}});
            if(m.links!==5) throw new Error(`${width}: menu links ${m.links}`);
            if(width<=900&&(Math.abs(m.x)>2||Math.abs(m.y)>2||Math.abs(m.w-m.vw)>3||Math.abs(m.h-m.vh)>3)) throw new Error(`${width}: mobile menu ${JSON.stringify(m)}`);
            await page.keyboard.press('Escape');

            if(pageErrors.length) throw new Error(`${width}: page errors ${pageErrors.join(' | ')}`);
            console.log(`GREEN ${width}x${height} triggers=${base.triggers} refs=${loaded}`);
            await context.close();
          }

          const reduced=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const rp=await reduced.newPage();
          await rp.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
          await rp.waitForFunction(()=>document.documentElement.classList.contains('conversion-flow-ready'),{timeout:12000});
          await rp.waitForTimeout(700);
          const rm=await rp.evaluate(()=>({motion:document.documentElement.dataset.motion,sw:document.documentElement.scrollWidth,iw:innerWidth,hidden:[...document.querySelectorAll('.reveal')].filter(el=>getComputedStyle(el).opacity==='0').length}));
          if(rm.motion!=='reduced'||rm.sw>rm.iw+1||rm.hidden!==0) throw new Error(`reduced-motion gate ${JSON.stringify(rm)}`);
          await reduced.close();

          await browser.close();
          console.log('VEROSPACE_CONVERSION_MOTION_ALL_GATES_GREEN');
          EOF
          node qa-conversion.mjs
