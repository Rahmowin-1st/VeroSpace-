name: VeroSpace Conversion Motion Code QA
on:
  push:
    branches: [verospace-conversion-motion-v1]
  workflow_dispatch:
jobs:
  conversion-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Static trust and motion audit
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          needles=('goo'+'gle','gsta'+'tic','goo'+'gle'+'apis')
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts or p.suffix.lower() not in {'.html','.css','.js','.json','.md','.txt','.yml','.yaml'}:
              continue
            text=p.read_text(errors='ignore').lower()
            if any(n in text for n in needles): bad.append(str(p))
          if bad: raise SystemExit('Blocked external-brand reference: '+', '.join(bad))

          motion=Path('conversion-motion.js').read_text()
          forbidden=['ScrollSmoother','normalizeScroll','addEventListener(\\'scroll\\'','addEventListener("scroll"','scrollTo(','scrollTop =','scrollTop=']
          hits=[x for x in forbidden if x in motion]
          if hits: raise SystemExit('Forbidden scroll ownership in conversion layer: '+', '.join(hits))
          if 'ScrollTrigger.min.js' not in motion or 'gsap.min.js' not in motion:
            raise SystemExit('GSAP/ScrollTrigger loader missing')
          if 'pin:' in motion or 'snap:' in motion:
            raise SystemExit('Pin/snap is not allowed in this round')
          print('STATIC_CONVERSION_AUDIT_GREEN')
          PY

      - name: Prepare browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1.55.0 >/dev/null 2>&1
          vendor_browser="$(printf 'goo%s-chrome' 'gle')"
          BROWSER_PATH="$(command -v chromium || command -v chromium-browser || command -v "$vendor_browser" || true)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Local Chromium QA — no deployment
        run: |
          python3 -m http.server 4173 >/tmp/verospace-conversion-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          cat > qa-conversion.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1366,768],[1440,900],[1600,900],[1920,1080]];
          const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});

          for(const [width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.classList.contains('conversion-structure-ready'),{timeout:10000});
            await page.waitForFunction(()=>['gsap','static-fallback'].includes(document.documentElement.dataset.motion),{timeout:20000});
            if((await page.evaluate(()=>document.documentElement.dataset.motion))!=='gsap') throw new Error(`${width}: GSAP did not initialize`);
            await page.waitForTimeout(1200);

            const base=await page.evaluate(()=>({
              y:scrollY,
              sw:document.documentElement.scrollWidth,
              iw:innerWidth,
              title:document.querySelector('#hero-title')?.innerText.trim(),
              trust:document.querySelectorAll('.trust-item').length,
              outcomes:document.querySelectorAll('.project-outcome').length,
              refs:document.querySelectorAll('.reference-tile').length,
              bridgeButtons:document.querySelectorAll('.cta-bridge [data-scroll]').length,
              rail:document.querySelectorAll('.process-rail').length,
              triggerCount:window.ScrollTrigger?.getAll().length||0,
              pinned:(window.ScrollTrigger?.getAll()||[]).some(t=>!!t.vars.pin),
              cards:document.querySelectorAll('.project-card').length,
              heroButtons:[...document.querySelectorAll('.hero-actions .pill-button')].map(b=>({text:b.textContent.trim(),h:b.getBoundingClientRect().height,w:b.getBoundingClientRect().width}))
            }));
            if(base.y!==0)throw new Error(`${width}: initial scrollY ${base.y}`);
            if(base.sw>base.iw+1)throw new Error(`${width}: horizontal overflow ${base.sw}>${base.iw}`);
            if(!base.title.includes('A calmer home.')||!base.title.includes('Built around how you live.'))throw new Error(`${width}: hero copy wrong ${base.title}`);
            if(base.trust!==4||base.outcomes!==5||base.refs!==6||base.bridgeButtons!==2||base.rail!==1||base.cards!==5)throw new Error(`${width}: conversion structure ${JSON.stringify(base)}`);
            if(base.triggerCount<18||base.pinned)throw new Error(`${width}: ScrollTrigger gate ${JSON.stringify(base)}`);
            if(base.heroButtons.length!==2||base.heroButtons.some(b=>b.h<44||b.w<100))throw new Error(`${width}: CTA targets ${JSON.stringify(base.heroButtons)}`);

            await page.mouse.wheel(0,720);
            await page.waitForTimeout(300);
            const down=await page.evaluate(()=>scrollY);
            if(down<100)throw new Error(`${width}: native wheel scroll failed ${down}`);

            await page.locator('#projects').scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            const projectVisible=await page.locator('.project-card').first().evaluate(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight});
            if(!projectVisible)throw new Error(`${width}: project proof not visible after scroll`);

            if(width===390||width===1440){
              const card=page.locator('.project-card').first();
              await card.scrollIntoViewIfNeeded();
              await card.click();
              const dialog=page.locator('#projectDialog[open]');
              await dialog.waitFor({state:'visible',timeout:5000});
              await page.waitForTimeout(700);
              const modal=await dialog.evaluate(el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,title:el.querySelector('#dialogTitle')?.textContent.trim(),facts:el.querySelectorAll('.dialog-facts>div').length}});
              if(modal.x<-2||modal.y<-2||modal.x+modal.w>modal.vw+2||modal.y+modal.h>modal.vh+2||!modal.title||modal.facts!==3)throw new Error(`${width}: modal ${JSON.stringify(modal)}`);
              await page.locator('.dialog-close').click();
            }

            if(pageErrors.length)throw new Error(`${width}: page errors ${pageErrors.join(' | ')}`);
            console.log(`GREEN ${width}x${height} triggers=${base.triggerCount} scroll=${down}`);
            await context.close();
          }

          const reduced=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const reducedPage=await reduced.newPage();
          await reducedPage.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
          await reducedPage.waitForFunction(()=>document.documentElement.classList.contains('conversion-structure-ready'),{timeout:10000});
          await reducedPage.waitForTimeout(700);
          const reducedState=await reducedPage.evaluate(()=>({motion:document.documentElement.dataset.motion,hidden:[...document.querySelectorAll('.reveal')].filter(el=>getComputedStyle(el).opacity==='0').length,sw:document.documentElement.scrollWidth,iw:innerWidth}));
          if(reducedState.motion!=='reduced'||reducedState.hidden!==0||reducedState.sw>reducedState.iw+1)throw new Error(`reduced motion gate ${JSON.stringify(reducedState)}`);
          await reduced.close();

          await browser.close();
          console.log('VEROSPACE_CONVERSION_MOTION_GREEN');
          EOF
          node qa-conversion.mjs
