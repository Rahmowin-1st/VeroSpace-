name: VeroSpace Experience v3 Final QA
on:
  push:
    branches: [verospace-no-blur-liquid-glass]
    paths: ['.github/workflows/experience-v3-final-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verospace-no-blur-liquid-glass
      - name: Wire final state layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'experience-v3.css' not in s:
            s=s.replace('<link rel="stylesheet" href="ultra-safe.css?v=20260902u2">','<link rel="stylesheet" href="ultra-safe.css?v=20260902u2">\n  <link rel="stylesheet" href="experience-v3.css?v=20260902x3">')
          if 'experience-v3-statefix.css' not in s:
            s=s.replace('<link rel="stylesheet" href="experience-v3.css?v=20260902x3">','<link rel="stylesheet" href="experience-v3.css?v=20260902x3">\n  <link rel="stylesheet" href="experience-v3-statefix.css?v=20260902x4">')
          if 'experience-v3.js' not in s:
            s=s.replace('<script src="ultra-ui.js?v=20260902u1" defer></script>','<script src="ultra-ui.js?v=20260902u1" defer></script>\n  <script src="experience-v3.js?v=20260902x3" defer></script>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'fix: wire persistent selected state'; git push origin HEAD:verospace-no-blur-liquid-glass; fi
      - name: Install browser QA
        run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Chromium acceptance matrix
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > qa-final.mjs <<'EOF'
          import {chromium} from 'playwright';
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1440,900]];
          const browser=await chromium.launch({headless:true});
          try{
            for(const [width,height] of sizes){
              const ctx=await browser.newContext({viewport:{width,height}}); const p=await ctx.newPage(); const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
              await p.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>document.querySelector('.reference-grid')?.dataset.experienceV3==='true',{timeout:15000});
              const b=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,refs:document.querySelectorAll('.reference-tile').length,preload:window.__verospaceImageCacheV3 instanceof Map}));
              if(b.sw>b.iw+1) throw new Error(`${width}: page overflow ${b.sw}>${b.iw}`);
              if(b.refs<21) throw new Error(`${width}: only ${b.refs} references`);
              if(!b.preload) throw new Error(`${width}: preload cache missing`);
              const blur=await p.evaluate(()=>[...document.querySelectorAll('*')].some(el=>{const c=getComputedStyle(el);return /blur\(/i.test(c.filter)||/blur\(/i.test(c.backdropFilter||'')||/blur\(/i.test(c.webkitBackdropFilter||'')}));
              if(blur) throw new Error(`${width}: blur present`);

              const first=p.locator('.process-list>li').first(), second=p.locator('.process-list>li').nth(1);
              await first.scrollIntoViewIfNeeded(); await first.click(); await p.waitForTimeout(120);
              const s=await first.evaluate(el=>({selected:el.classList.contains('is-selected'),transform:getComputedStyle(el).transform,border:getComputedStyle(el).borderColor,shadow:getComputedStyle(el).boxShadow}));
              if(!s.selected||s.transform==='none'||!s.border.includes('205')||s.shadow==='none') throw new Error(`${width}: tactile selected state bad ${JSON.stringify(s)}`);
              await second.click(); await p.waitForTimeout(100);
              if(await first.evaluate(el=>el.classList.contains('is-selected'))||!await second.evaluate(el=>el.classList.contains('is-selected'))) throw new Error(`${width}: single persistent selection failed`);

              if(width<=900){
                await p.locator('.menu-button').click(); await p.waitForTimeout(450);
                const m=await p.evaluate(()=>{const e=document.querySelector('.site-menu'),r=e.getBoundingClientRect(),d=getComputedStyle(document.querySelector('.menu-backdrop'));return {x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,open:e.classList.contains('open'),opacity:d.opacity}});
                if(!m.open||m.x<=0||m.y<=0||m.w>=m.vw-2||m.h>=m.vh-2||Number(m.opacity)<.5) throw new Error(`${width}: floating menu/curtain bad ${JSON.stringify(m)}`);
                await p.keyboard.press('Escape');
              }

              const rail=p.locator('.reference-grid'); await rail.scrollIntoViewIfNeeded(); const before=await rail.evaluate(el=>el.scrollLeft); await p.locator('[data-reference-next]').click(); await p.waitForTimeout(450); const after=await rail.evaluate(el=>el.scrollLeft);
              if(after<=before+20) throw new Error(`${width}: rail did not move ${before}->${after}`);
              await p.evaluate(()=>window.scrollTo(0,0)); await p.mouse.wheel(0,700); await p.waitForTimeout(260); const y=await p.evaluate(()=>scrollY); if(y<100) throw new Error(`${width}: native scroll failed ${y}`);
              if(errors.length) throw new Error(`${width}: runtime errors ${errors.join(' | ')}`);
              console.log(`GREEN ${width} refs=${b.refs} rail=${Math.round(after)} y=${y}`); await ctx.close();
            }
            console.log('EXPERIENCE_V3_FINAL_GREEN');
          }finally{await browser.close()}
          EOF
          node qa-final.mjs
