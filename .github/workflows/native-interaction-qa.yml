name: VeroSpace Native Interaction QA
on:
  push:
    branches: [verospace-hybrid-native-final]
    paths: ['.github/workflows/native-interaction-qa.yml']
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify browser ownership and regressions
        env:
          TARGET: 'https://verospace-landing-jvub9rnnd-shahboz.vercel.app/?_vercel_share=w6dZBYiGBtcI4nlUMuugtxUYt3sxe9p3'
        run: |
          cat > qa.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const [w,h] of [[320,700],[390,844],[1440,900],[1920,1080]]){
            const c=await browser.newContext({viewport:{width:w,height:h}}); const p=await c.newPage();
            await p.goto(process.env.TARGET,{waitUntil:'domcontentloaded',timeout:60000});
            await p.locator('.hero').waitFor({state:'visible',timeout:20000});
            await p.waitForFunction(()=>document.querySelector('.hero-image')?.naturalWidth>0,{timeout:30000});
            const base=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,cards:document.querySelectorAll('.project-card').length,nativeLoaded:[...document.scripts].some(s=>s.src.includes('native.js'))}));
            if(base.sw>base.iw+1||base.cards!==5||!base.nativeLoaded)throw new Error(`${w}: base ${JSON.stringify(base)}`);
            const bodyPrevented=await p.evaluate(()=>{const el=document.querySelector('.hero-copy');const ev=new MouseEvent('contextmenu',{bubbles:true,cancelable:true});el.dispatchEvent(ev);return ev.defaultPrevented;});
            const inputPrevented=await p.evaluate(()=>{const el=document.querySelector('input[name="name"]');const ev=new MouseEvent('contextmenu',{bubbles:true,cancelable:true});el.dispatchEvent(ev);return ev.defaultPrevented;});
            if(!bodyPrevented||inputPrevented)throw new Error(`${w}: ownership body=${bodyPrevented} input=${inputPrevented}`);
            await p.mouse.wheel(0,700);await p.waitForTimeout(250);if(await p.evaluate(()=>scrollY)<100)throw new Error(`${w}: scroll failed`);
            await p.locator('.menu-button').click();await p.locator('.site-menu.open').waitFor({state:'visible',timeout:5000});await p.waitForTimeout(550);
            if(w<=900){const g=await p.locator('.site-menu').evaluate(e=>{const r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height,innerWidth,innerHeight]});if(Math.abs(g[0])>2||Math.abs(g[1])>2||Math.abs(g[2]-g[4])>3||Math.abs(g[3]-g[5])>3)throw new Error(`${w}: menu ${g}`);}
            await c.close(); console.log(`GREEN ${w}x${h}`);
          }
          await browser.close(); console.log('NATIVE_INTERACTION_GREEN');
          EOF
          node qa.mjs
