name: VeroSpace Persist 390 Debug
on:
  push:
    branches: [verospace-mobile-production-fix]
    paths: ['.github/workflows/mobile-production-fix-debug-commit.yml']
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect and persist
        env:
          TARGET_URL: 'https://verospace-landing-eatruping-shahboz.vercel.app/?_vercel_share=aACVcMIBFUJSKyHZ2r76R9NKaOtHYOFd'
        run: |
          mkdir -p .qa
          cat > /tmp/debug.mjs <<'EOF'
          import {chromium} from 'playwright'; import fs from 'fs';
          let out={status:'RED'};
          try{
            const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport:{width:390,height:844}}); const p=await c.newPage();
            await p.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000}); await p.locator('.hero').waitFor({state:'visible',timeout:30000}); await p.waitForTimeout(600);
            out.base=await p.evaluate(()=>({url:location.href,title:document.title,y:scrollY,sw:document.documentElement.scrollWidth,iw:innerWidth,hero:{src:document.querySelector('.hero-image')?.getAttribute('src'),nw:document.querySelector('.hero-image')?.naturalWidth,nh:document.querySelector('.hero-image')?.naturalHeight},ctas:[...document.querySelectorAll('.hero-actions .button')].map(x=>x.textContent.trim())}));
            out.asset=await p.evaluate(async()=>{const r=await fetch('/assets/verospace-home-yellow.webp');const b=await r.blob();return {status:r.status,type:r.headers.get('content-type'),size:b.size}});
            await p.locator('.menu-button').click(); await p.waitForTimeout(400);
            out.menu=await p.evaluate(()=>{const e=document.querySelector('.site-menu'),r=e.getBoundingClientRect(),cs=getComputedStyle(e);return {class:e.className,aria:e.getAttribute('aria-hidden'),x:r.x,y:r.y,w:r.width,h:r.height,vw:innerWidth,vh:innerHeight,bg:cs.backgroundImage,bgc:cs.backgroundColor,links:[...document.querySelectorAll('.menu-links strong')].map(x=>{const q=x.getBoundingClientRect();return {t:x.textContent.trim(),w:q.width,h:q.height}})}});
            out.status='GREEN'; await b.close();
          }catch(e){out.error=String(e?.stack||e)}
          fs.writeFileSync('.qa/390-debug.json',JSON.stringify(out,null,2));
          EOF
          node /tmp/debug.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .qa/390-debug.json
          git commit -m 'test: persist 390px QA result'
          git push origin HEAD:verospace-mobile-production-fix
