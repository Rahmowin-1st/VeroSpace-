name: VeroSpace V4 Proof QA
on:
  push:
    branches: [verospace-proof-projects-v4]
    paths: ['index.html','v4.css','v4.js','.github/workflows/v4-proof-qa.yml']
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Static architecture gates
        run: |
          node <<'EOF'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('v4.css','utf8');
          const js=fs.readFileSync('v4.js','utf8');
          const fail=m=>{throw new Error(m)};
          if(/ultra-ui|experience-v3|conversion-motion|conversion-flow|reference-gallery|trust-band/.test(html)) fail('legacy runtime layer still referenced');
          if(/backdrop-filter\s*:|filter\s*:\s*blur\(/i.test(css+js)) fail('runtime blur found');
          const cards=(html.match(/class="project-card reveal"/g)||[]).length;
          const tracks=(html.match(/class="project-track"/g)||[]).length;
          const photos=(html.match(/unsplash\.com\/photos\//g)||[]).length;
          if(cards!==5) fail(`project count ${cards}`);
          if(tracks!==5) fail(`project track count ${tracks}`);
          if(photos!==15) fail(`project image count ${photos}`);
          if(/scroll-snap|ScrollSmoother|pin\s*:/.test(css+js)) fail('scroll hijack/snap/pin found');
          console.log('STATIC_GREEN cards=5 images=15 no-blur no-legacy-injection');
          EOF
      - name: Install browser driver
        run: npm init -y >/dev/null 2>&1 && npm i playwright-core@1.55.0 >/dev/null 2>&1
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/v4-http.log 2>&1 &
      - name: Chromium matrix
        run: |
          cat > qa-v4.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          import {execSync} from 'node:child_process';
          const candidates=['google-chrome','google-chrome-stable','chromium','chromium-browser'];
          let executablePath='';
          for(const c of candidates){try{executablePath=execSync(`which ${c}`,{encoding:'utf8'}).trim();if(executablePath)break}catch{}}
          if(!executablePath) throw new Error('No Chromium/Chrome binary on runner');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1440,900],[1920,1080]];
          for(const [width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage(); const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.hero').waitFor({state:'visible'});
            const base=await page.evaluate(()=>{
              const h=document.querySelector('.site-header')?.getBoundingClientRect();
              const cards=[...document.querySelectorAll('.project-card')];
              return {sw:document.documentElement.scrollWidth,iw:innerWidth,header:h?{x:h.x,w:h.width}:null,cards:cards.length,images:cards.map(c=>c.querySelectorAll('.project-track img').length),legacy:document.querySelectorAll('.reference-gallery,.trust-band').length};
            });
            if(base.sw>base.iw+2) throw new Error(`${width}: page overflow ${base.sw}>${base.iw}`);
            if(!base.header||base.header.x<0||base.header.x+base.header.w>base.iw+1) throw new Error(`${width}: header outside viewport ${JSON.stringify(base.header)}`);
            if(base.cards!==5||base.images.some(n=>n!==3)||base.legacy!==0) throw new Error(`${width}: project architecture ${JSON.stringify(base)}`);
            if(width<=900){
              await page.locator('.menu-button').click(); await page.waitForTimeout(320);
              const m=await page.evaluate(()=>{const p=document.querySelector('.site-menu').getBoundingClientRect(),c=getComputedStyle(document.querySelector('.menu-curtain'));return {x:p.x,y:p.y,w:p.width,h:p.height,vw:innerWidth,vh:innerHeight,curtain:c.opacity,open:document.querySelector('.site-menu').classList.contains('open')}});
              if(!m.open||m.x<=0||m.w>=m.vw||m.y<=60||m.h>=m.vh||Number(m.curtain)<.5) throw new Error(`${width}: floating menu gate ${JSON.stringify(m)}`);
              await page.keyboard.press('Escape');
            }
            const first=page.locator('.project-card').first(); await first.scrollIntoViewIfNeeded();
            const next=first.locator('[data-next]'); const track=first.locator('.project-track');
            const before=await track.evaluate(e=>e.scrollLeft); await next.click(); await page.waitForTimeout(500); const after=await track.evaluate(e=>e.scrollLeft);
            if(after<=before+10) throw new Error(`${width}: card carousel did not advance ${before}->${after}`);
            await first.locator('.project-open').click(); await page.locator('#projectDialog[open]').waitFor({state:'visible'});
            const modal=await page.evaluate(()=>{const d=document.querySelector('#projectDialog'),r=d.getBoundingClientRect();return {imgs:d.querySelectorAll('.modal-track img').length,title:d.querySelector('#modalTitle')?.textContent?.trim(),goal:d.querySelector('#modalGoal')?.textContent?.trim(),result:d.querySelector('#modalResult')?.textContent?.trim(),x:r.x,w:r.width,vw:innerWidth}});
            if(modal.imgs!==3||!modal.title||!modal.goal||!modal.result||modal.x<0||modal.x+modal.w>modal.vw+2) throw new Error(`${width}: modal gate ${JSON.stringify(modal)}`);
            await page.keyboard.press('Escape');
            await page.locator('#contact').scrollIntoViewIfNeeded();
            const noPost=await page.evaluate(()=>{let calls=0;const old=window.fetch;window.fetch=(...args)=>{calls++;return old(...args)};document.querySelector('#consultationForm').requestSubmit();return new Promise(r=>setTimeout(()=>r({calls,invalid:document.querySelector('[name="name"]').getAttribute('aria-invalid')}),80));});
            if(noPost.calls!==0||noPost.invalid!=='true') throw new Error(`${width}: empty form validation ${JSON.stringify(noPost)}`);
            if(pageErrors.length) throw new Error(`${width}: page errors ${pageErrors.join(' | ')}`);
            console.log(`GREEN ${width}x${height}`); await context.close();
          }
          await browser.close(); console.log('V4_BROWSER_MATRIX_GREEN');
          EOF
          node qa-v4.mjs
