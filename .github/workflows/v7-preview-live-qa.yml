name: VeroSpace V7 Preview Live QA
on:
  push:
    branches: [verospace-canonical-upgrade-v7]
    paths: ['.github/workflows/v7-preview-live-qa.yml']
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Preview browser matrix
        run: |
          cat > qa-live.mjs <<'EOF'
          import {chromium} from 'playwright';
          const TARGET='https://verospace-landing-i3hisq8hm-shahboz.vercel.app/?_vercel_share=53HcERs9x77LeNVSdwPwi8gjb9AlIMaO';
          const fail=m=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const sizes=[[320,700],[360,780],[390,844],[430,932],[768,1024],[1024,768],[1366,768],[1440,900],[1600,900],[1920,1080]];
          for(const [width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/Failed to load resource.*favicon/i.test(m.text()))errors.push(m.text())});
            await page.goto(TARGET,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#heroTitle',{state:'visible',timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.project-track figure.v7-current').length===5,{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.vs-select-trigger').length===2,{timeout:20000});
            const initial=await page.evaluate(()=>scrollY);
            await page.waitForTimeout(1800);
            const stable=await page.evaluate(()=>scrollY);
            if(initial!==0||stable!==0)fail(`${width}: initial scroll moved ${initial}->${stable}`);
            const shell=await page.evaluate(()=>{
              const actions=[...document.querySelectorAll('.hero-actions button')];
              const title=document.querySelector('#heroTitle');
              return {
                overflow:document.documentElement.scrollWidth-innerWidth,
                nativeSelects:document.querySelectorAll('select').length,
                customSelects:document.querySelectorAll('.vs-select-trigger').length,
                cards:document.querySelectorAll('.project-card').length,
                docks:document.querySelectorAll('.mobile-journey-dock,.hero-dock,.hero-rail').length,
                heroTitle:title?.textContent.trim()||'',
                heroOpacity:Number(getComputedStyle(title).opacity),
                actions:actions.map(b=>({t:b.textContent.trim(),w:b.getBoundingClientRect().width,h:b.getBoundingClientRect().height,o:Number(getComputedStyle(b).opacity)})),
                snap:getComputedStyle(document.documentElement).scrollSnapType||'none'
              };
            });
            if(shell.overflow>1||shell.nativeSelects!==0||shell.customSelects!==2||shell.cards!==5||shell.docks!==0)fail(`${width}: shell ${JSON.stringify(shell)}`);
            if(!shell.heroTitle||shell.heroOpacity<.99||shell.actions.length!==2||shell.actions[0].t!=='Book a consultation'||shell.actions[1].t!=='Explore projects'||shell.actions.some(a=>a.w<44||a.h<44||a.o<.99))fail(`${width}: hero ${JSON.stringify(shell)}`);
            if(shell.snap&&shell.snap!=='none')fail(`${width}: scroll snap ${shell.snap}`);

            const hero=page.locator('.hero');
            await hero.hover({position:{x:Math.min(width-20,Math.max(20,width/2)),y:Math.min(height-20,Math.max(20,height/2))}}).catch(()=>{});
            await page.mouse.wheel(0,500);
            await page.waitForTimeout(350);
            const down=await page.evaluate(()=>scrollY);
            if(down<80)fail(`${width}: native wheel did not scroll ${down}`);
            await page.mouse.wheel(0,-500);
            await page.waitForTimeout(350);

            await page.locator('#projects').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1200);
            const imageState=await page.locator('.project-track img').evaluateAll(imgs=>imgs.map(i=>({src:i.currentSrc||i.src,w:i.naturalWidth,h:i.naturalHeight,complete:i.complete})));
            if(imageState.length!==15||imageState.some(i=>!i.complete||i.w<100||i.h<100))fail(`${width}: project image failure ${JSON.stringify(imageState)}`);

            if(width===390||width===1440){
              const cards=page.locator('.project-card');
              const required=['Goal','Space','Design','Material direction','Key decisions','Timeline','Approval path','Concept result','Support + handover'];
              for(let i=0;i<5;i++){
                const card=cards.nth(i); await card.scrollIntoViewIfNeeded(); await page.waitForTimeout(150);
                await card.locator('.project-open').click();
                const dialog=page.locator('#projectDialog'); await dialog.waitFor({state:'visible'});
                const d=await dialog.evaluate((el,req)=>{const labels=[...el.querySelectorAll('.detail-card>span')].map(x=>x.textContent.trim());return{images:el.querySelectorAll('.modal-track figure').length,meta:el.querySelectorAll('.modal-meta span').length,sections:el.querySelectorAll('.detail-card').length,missing:req.filter(x=>!labels.includes(x)),arrows:[...el.querySelectorAll('.modal-arrow-group')].filter(x=>getComputedStyle(x).display!=='none').length,cta:el.querySelector('.modal-cta')?.textContent.trim()||''}},required);
                if(d.images!==3||d.meta<4||d.sections<9||d.missing.length||d.arrows||!/Discuss a similar project/i.test(d.cta))fail(`${width}: modal ${i+1} ${JSON.stringify(d)}`);
                await page.locator('.modal-close').click();
              }
              await page.locator('.menu-button').click(); await page.waitForTimeout(250);
              const menu=await page.locator('#siteMenu').evaluate(el=>{const s=getComputedStyle(el);return{links:el.querySelectorAll('.menu-list a').length,bg:s.backgroundImage||s.backgroundColor,opacity:Number(s.opacity),text:el.textContent.replace(/\s+/g,' ').trim()}});
              if(menu.links!==4||menu.opacity<.99||/Book consultation/i.test(menu.text)||!/gradient|rgb/i.test(menu.bg))fail(`${width}: menu ${JSON.stringify(menu)}`);
              await page.keyboard.press('Escape');
            }

            const getRes=await page.request.get('https://verospace-landing-i3hisq8hm-shahboz.vercel.app/api/consultation');
            if(getRes.status()!==405)fail(`${width}: consultation GET ${getRes.status()}`);
            if(errors.length)fail(`${width}: console ${JSON.stringify(errors.slice(0,5))}`);
            console.log(`PREVIEW_GREEN ${width}x${height}`);
            await context.close();
          }
          await browser.close();
          console.log('VEROSPACE_PREVIEW_LIVE_QA_GREEN');
          EOF
          node qa-live.mjs
